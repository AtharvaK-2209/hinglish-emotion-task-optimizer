services:
  - type: web
    name: emosync-task-optimizer
    runtime: python
    buildCommand: pip install -r requirements.txt && python download_nltk.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
